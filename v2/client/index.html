<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>L-Town v2</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="lobby" class="lobby">
  <h1>L-TOWN v2 — RX-11 Atma Cores</h1>
  <p>3049 Remote Age — same chassis, soul decides.</p>
  <input id="nameInput" placeholder="callsign" maxlength="20">
  <select id="coreSelect"></select>
  <button id="joinBtn">ENTER ARENA (Solo/Pure)</button>
  <button id="createBtn">CREATE Global (NOSTR)</button>
  <button id="qrBtn">SHOW QR (LAN offline)</button>
  <div id="qrBox" style="display:none;word-break:break-all;background:#111;padding:8px;border-radius:8px;font-size:10px"></div>
  <div id="roomList" style="max-height:160px;overflow:auto;border:1px solid #222;border-radius:8px;padding:6px;font-size:12px"></div>
  <div style="font-size:11px;opacity:.6">NOSTR discovery only — game stays direct P2P (LAN ~1ms, clearnet direct)</div>
</div>
<canvas id="canvas"></canvas>
<div id="hud"><span id="hp"></span> <span id="score"></span> <span id="timer"></span></div>
<script type="module" src="/src/main.ts"></script>
<script>
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js')
</script>

</body>
</html>
