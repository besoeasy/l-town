server {
    listen 30300;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript image/svg+xml;

    # Cache control for HTML (SPA entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Cache control for hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API info endpoint
    location /api/info {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"status":"ok","port":30300}';
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
